{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<style>
    /* Contenedor central para alinear la tarjeta en el medio */
    .auth-wrapper {
        min-height: 75vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 0;
    }

    /* Tarjeta estilo Vidrio Esmerilado (Glassmorphism) */
    .auth-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 2rem;
        box-shadow: 0 15px 35px rgba(139, 69, 19, 0.08);
        padding: 3rem 2.5rem;
        width: 100%;
        max-width: 450px;
    }

    /* Título con gradiente */
    .auth-title {
        font-weight: 800;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #5c2c0b, #d97706);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    /* Botón principal */
    .btn-gradient {
        background: linear-gradient(135deg, #d97706, #b45309);
        color: white;
        border: none;
        transition: all 0.3s ease;
    }
    .btn-gradient:hover {
        background: linear-gradient(135deg, #f59e0b, #d97706);
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -5px rgba(217, 119, 6, 0.4);
    }

    /* Enlaces */
    .auth-link {
        color: #d97706;
        font-weight: 700;
        text-decoration: none;
        transition: color 0.2s;
    }
    .auth-link:hover {
        color: #b45309;
        text-decoration: underline;
    }

    /* Icono superior */
    .icon-circle {
        width: 65px;
        height: 65px;
        background: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        box-shadow: 0 8px 20px rgba(217, 119, 6, 0.15);
        margin-bottom: 1.5rem;
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        
        <!-- Encabezado de la tarjeta -->
        <div class="text-center mb-4">
            <div class="icon-circle">
                <i class="fa-solid fa-user text-warning fs-3"></i>
            </div>
            <h2 class="auth-title h3 mb-1">¡Hola de nuevo!</h2>
            <p class="text-secondary small">Ingresa tus datos para continuar</p>
        </div>

        <!-- Formulario -->
        <form method="POST" action="{{ url_for('auth.login') }}">
            
            <!-- Campo de Email -->
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold text-uppercase ms-2">Email</label>
                <div class="input-group shadow-sm rounded-pill overflow-hidden bg-white border-0">
                    <span class="input-group-text border-0 bg-transparent ps-4 pe-2">
                        <i class="fa-solid fa-envelope text-muted opacity-50"></i>
                    </span>
                    <input type="email" name="email" class="form-control border-0 bg-transparent py-3 px-2" placeholder="tu@correo.com" required>
                </div>
            </div>
            
            <!-- Campo de Contraseña -->
            <div class="mb-4">
                <label class="form-label text-muted small fw-bold text-uppercase ms-2">Contraseña</label>
                <div class="input-group shadow-sm rounded-pill overflow-hidden bg-white border-0">
                    <span class="input-group-text border-0 bg-transparent ps-4 pe-2">
                        <i class="fa-solid fa-lock text-muted opacity-50"></i>
                    </span>
                    <input type="password" name="password" class="form-control border-0 bg-transparent py-3 px-2" placeholder="••••••••" required>
                </div>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" class="btn btn-gradient w-100 rounded-pill py-3 fw-bold fs-6 mb-3">
                Entrar <i class="fa-solid fa-arrow-right ms-1"></i>
            </button>
            
        </form>
        
        <!-- Pie de tarjeta (Registro) -->
        <div class="text-center mt-4">
            <p class="text-secondary small mb-0">
                ¿No tienes cuenta? <br class="d-md-none">
                <a href="{{ url_for('auth.registro') }}" class="auth-link">Regístrate aquí</a>
            </p>
        </div>

    </div>
</div>
{% endblock %}
