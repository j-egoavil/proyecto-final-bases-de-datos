{% extends "base.html" %}
{% block title %}Agendar tutoría{% endblock %}
{% block content %}

<a href="{{ url_for('servicios.detalle', id_servicio=servicio.id_servicio) }}"
   class="btn btn-sm btn-outline-secondary mb-3">← Volver al servicio</a>

<h2 class="mb-1">Agendar: {{ servicio.nombre }}</h2>
<p class="text-muted">
    {{ servicio.materia_nombre }} — Tutor: {{ servicio.tutor_nombre }} — {{ servicio.precio_tokens }} tokens
</p>

<form method="POST" class="row g-3 mt-3">
    <div class="col-md-4">
        <label class="form-label">Fecha</label>
        <input type="date" name="fecha" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Hora inicio</label>
        <input type="time" name="hora_inicio" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Hora fin</label>
        <input type="time" name="hora_fin" class="form-control" required>
    </div>
    <div class="col-12">
        <label class="form-label">Tema (opcional)</label>
        <input type="text" name="tema" class="form-control" placeholder="Ej. Dudas sobre la unidad 3">
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-primary">Confirmar agendamiento</button>
    </div>
</form>

{% endblock %}
