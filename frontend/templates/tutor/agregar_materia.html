{% extends "base.html" %}
{% block title %}Agregar materia{% endblock %}
{% block content %}

<h2 class="mb-4">Agregar una materia que domino</h2>

<form method="POST" action="{{ url_for('tutor.agregar_materia') }}" class="row g-3">
    <div class="col-md-8">
        <label class="form-label">Materia</label>
        <select name="id_materia" class="form-select" required>
            <option value="">Selecciona...</option>
            {% for materia in materias %}
                <option value="{{ materia.id_materia }}">{{ materia.nombre }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-4">
        <label class="form-label">Nota obtenida</label>
        <input type="number" name="nota" class="form-control" min="4.0" max="5.0" step="0.1" required>
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-primary">Agregar</button>
    </div>
</form>

{% endblock %}
